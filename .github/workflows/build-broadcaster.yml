name: Build USALB Broadcaster

on:
  push:
    branches: [main]
    paths:
      - "broadcaster/windows/**"
      - "broadcaster/setup-usabl-broadcaster.ps1"
      - ".github/workflows/build-broadcaster.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: broadcaster/windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore USALBBroadcaster.csproj

      - name: Publish self-contained Windows app
        run: dotnet publish USALBBroadcaster.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create portable ZIP
        shell: powershell
        run: |
          Set-Content -Path "publish\README.txt" -Value "USALB Broadcaster. Run USALB.Broadcaster.exe."
          Compress-Archive -Path "publish\*" -DestinationPath "$env:GITHUB_WORKSPACE\USALB-Broadcaster-Portable.zip" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: USALB-Broadcaster-Setup
          path: broadcaster/windows/installer-output/USALB-Broadcaster-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: USALB-Broadcaster-Portable
          path: USALB-Broadcaster-Portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: broadcaster-latest
          name: USALB Broadcaster Latest
          body: |
            Windows installer and portable build of USALB Broadcaster.
            Recommended: run USALB-Broadcaster-Setup.exe.
          files: |
            broadcaster/windows/installer-output/USALB-Broadcaster-Setup.exe
            USALB-Broadcaster-Portable.zip
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
