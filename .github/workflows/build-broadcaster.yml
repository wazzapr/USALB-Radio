name: Build USALB Broadcaster

on:
  push:
    branches: [main]
    paths:
      - "broadcaster/**"
      - ".github/workflows/build-broadcaster.yml"
  pull_request:
    branches: [main]
    paths:
      - "broadcaster/**"
      - ".github/workflows/build-broadcaster.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: broadcaster/windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare USALB application icon
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE "broadcaster/windows/Assets/usalb-logo-transparent.png"
          $iconPath = Join-Path $env:GITHUB_WORKSPACE "broadcaster/windows/Assets/usalb-radio.ico"
          if (-not (Test-Path $sourcePath)) { throw "USALB logo asset not found: $sourcePath" }
          $src = [System.Drawing.Image]::FromFile($sourcePath)
          try {
            $bmp = New-Object System.Drawing.Bitmap 256,256
            try {
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              try {
                $g.Clear([System.Drawing.Color]::Transparent)
                $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
                $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
                $ratio = [Math]::Min(256.0 / $src.Width, 256.0 / $src.Height)
                $w = [int]($src.Width * $ratio)
                $h = [int]($src.Height * $ratio)
                $x = [int]((256 - $w) / 2)
                $y = [int]((256 - $h) / 2)
                $g.DrawImage($src, $x, $y, $w, $h)
              } finally {
                $g.Dispose()
              }
              $hIcon = $bmp.GetHicon()
              $icon = [System.Drawing.Icon]::FromHandle($hIcon)
              try {
                $stream = [System.IO.File]::Create($iconPath)
                try { $icon.Save($stream) } finally { $stream.Dispose() }
              } finally {
                $icon.Dispose()
              }
            } finally {
              $bmp.Dispose()
            }
          } finally {
            $src.Dispose()
          }
          if (-not (Test-Path $iconPath)) { throw "Failed to create application icon: $iconPath" }

      - name: Restore
        run: dotnet restore USALBBroadcaster.csproj

      - name: Publish self-contained Windows app
        run: dotnet publish USALBBroadcaster.csproj -c Release -r win-x64 --self-contained true -o publish /p:BroadcasterBuild=${{ github.sha }}

      - name: Build automatic updater helper
        shell: powershell
        run: |
          dotnet publish Updater/USALB.Broadcaster.Updater.csproj -c Release -r win-x64 --self-contained true -o Updater/publish
          Copy-Item Updater/publish/USALB.Broadcaster.Updater.exe publish/USALB.Broadcaster.Updater.exe -Force

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Sync installer version
        shell: powershell
        run: |
          [xml]$project = Get-Content USALBBroadcaster.csproj
          $version = ([string]$project.Project.PropertyGroup.Version).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Broadcaster version is missing." }
          $iss = Get-Content installer.iss -Raw
          $iss = $iss -replace '#define MyAppVersion ".+?"', ('#define MyAppVersion "' + $version + '"')
          $iss = $iss -replace 'VersionInfoVersion=.*', ('VersionInfoVersion=' + $version + '.0')
          $iss = $iss -replace 'VersionInfoTextVersion=.*', ('VersionInfoTextVersion=' + $version)
          $iss = $iss -replace 'VersionInfoProductVersion=.*', ('VersionInfoProductVersion=' + $version + '.0')
          Set-Content -Path installer.iss -Value $iss

      - name: Validate release notes
        shell: powershell
        run: |
          [xml]$project = Get-Content USALBBroadcaster.csproj
          $version = ([string]$project.Project.PropertyGroup.Version).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Broadcaster version is missing." }
          $pattern = '(?m)^##\s+' + [regex]::Escape($version) + '\s*$'
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch $pattern) {
            throw "CHANGELOG.md does not contain a release section for broadcaster v$version."
          }

      - name: Build Windows installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create portable ZIP
        shell: powershell
        run: |
          Set-Content -Path "publish\README.txt" -Value "USALB Broadcaster. Run USALB.Broadcaster.exe."
          Compress-Archive -Path "publish\*" -DestinationPath "$env:GITHUB_WORKSPACE\USALB-Broadcaster-Portable.zip" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: USALB-Broadcaster-Setup
          path: broadcaster/windows/installer-output/USALB-Broadcaster-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: USALB-Broadcaster-Portable
          path: USALB-Broadcaster-Portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Read broadcaster version
        id: version
        shell: powershell
        run: |
          [xml]$project = Get-Content USALBBroadcaster.csproj
          $version = ([string]$project.Project.PropertyGroup.Version).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Broadcaster version is missing." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Prepare release notes
        id: release_notes
        shell: powershell
        run: |
          [xml]$project = Get-Content USALBBroadcaster.csproj
          $version = ([string]$project.Project.PropertyGroup.Version).Trim()
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match ('^##\s+' + [regex]::Escape($version) + '\s*$')) {
              $start = $i
              break
            }
          }
          if ($start -lt 0) { throw "Release notes for v$version were not found." }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s+') {
              $end = $i
              break
            }
          }
          $notes = ($lines[$start..($end - 1)] -join [Environment]::NewLine).Trim()
          $notes += [Environment]::NewLine + [Environment]::NewLine + "Build: " + "${{ github.sha }}"
          "body<<USALB_RELEASE_NOTES" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "USALB_RELEASE_NOTES" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: broadcaster-latest
          name: USALB Broadcaster ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            broadcaster/windows/installer-output/USALB-Broadcaster-Setup.exe
            USALB-Broadcaster-Portable.zip
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
